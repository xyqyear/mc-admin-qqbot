[project]
name = "mc-admin-qqbot"
version = "0.1.1"
description = "A durable QQ bridge for Minecraft servers managed by mc-admin"
readme = "README.md"
authors = [
    { name = "xyqyear", email = "xyqyear@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite~=0.22.1",
    "alembic~=1.18.5",
    "nonebot-adapter-onebot~=2.4.6",
    "nonebot2[fastapi,httpx,websockets]~=2.5.0",
    "pydantic-settings>=2.13.0,<3",
    "sqlalchemy[asyncio]~=2.0.51",
]

[project.scripts]
mc-admin-qqbot = "mc_admin_qqbot.__main__:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nonebug~=0.4.4",
    "pyright>=1.1.409",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.15.0,<0.16",
]

[tool.nonebot]
plugin_dirs = []

[tool.nonebot.plugins]
"@local" = ["mc_admin_qqbot.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "--strict-markers --cov=mc_admin_qqbot --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["mc_admin_qqbot"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.pyright]
include = ["src", "tests", "alembic"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC", "B", "C4", "PT", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
