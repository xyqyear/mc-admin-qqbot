[project]
name = "mc-admin-qqbot"
version = "0.3.0"
description = "An official QQ bot for Minecraft servers managed by mc-admin"
readme = "README.md"
authors = [
    { name = "xyqyear", email = "xyqyear@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite~=0.22.1",
    "aiohttp>=3.14.5,<4",
    "pydantic-settings>=2.13.0,<3",
    "sqlalchemy[asyncio]~=2.0.51",
    "pillow>=13,<14",
]

[project.scripts]
mc-admin-qqbot = "mc_admin_qqbot.__main__:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.15.0,<0.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers --cov=mc_admin_qqbot --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["mc_admin_qqbot"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC", "B", "C4", "PT", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
