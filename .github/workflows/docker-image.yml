name: Qualify and Publish Application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei fonts-dejavu-core
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests
      - run: uv run pyright
      - run: uv run pytest --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: coverage.xml

  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          load: true
          tags: |
            mc-admin-qqbot:qualified
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test rendering and writable database
        run: |
          docker run --rm --entrypoint python mc-admin-qqbot:qualified -c \
            'import asyncio; from mc_admin_qqbot.database import Database; from mc_admin_qqbot.roster import render_player_list; db = Database("sqlite+aiosqlite:///./data/smoke.db", "smoke"); asyncio.run(db.initialize()); asyncio.run(db.close()); assert render_player_list("白名单", "smoke", ["Steve"]).startswith(b"\x89PNG")'
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish qualified image
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Bind qualification receipt to commit
        env:
          QUALIFIED_SHA: ${{ github.sha }}
        run: |
          python -c 'import json, os; print(json.dumps({"sha": os.environ["QUALIFIED_SHA"], "validation": "passed", "coverage_gate": 95, "image_build_and_smoke": "passed"}))' > qualification.json
      - uses: actions/upload-artifact@v4
        with:
          name: qualification
          path: qualification.json
