services:
  bot:
    image: ghcr.io/xyqyear/mc-admin-qqbot:latest
    pull_policy: always
    container_name: mc-admin-qqbot
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      MC_ADMIN_QQBOT_QQ_BOT_ID: "${MC_ADMIN_QQBOT_QQ_BOT_ID:?Set MC_ADMIN_QQBOT_QQ_BOT_ID}"
      MC_ADMIN_QQBOT_QQ_GROUP_ID: "${MC_ADMIN_QQBOT_QQ_GROUP_ID:?Set MC_ADMIN_QQBOT_QQ_GROUP_ID}"
      MC_ADMIN_QQBOT_ONEBOT_ACCESS_TOKEN: "${MC_ADMIN_QQBOT_ONEBOT_ACCESS_TOKEN:?Set MC_ADMIN_QQBOT_ONEBOT_ACCESS_TOKEN}"
      MC_ADMIN_QQBOT_MC_ADMIN_BASE_URL: "${MC_ADMIN_QQBOT_MC_ADMIN_BASE_URL:?Set MC_ADMIN_QQBOT_MC_ADMIN_BASE_URL}"
      MC_ADMIN_QQBOT_MC_ADMIN_MASTER_TOKEN: "${MC_ADMIN_QQBOT_MC_ADMIN_MASTER_TOKEN:?Set MC_ADMIN_QQBOT_MC_ADMIN_MASTER_TOKEN}"
      MC_ADMIN_QQBOT_SUPERUSERS: "${MC_ADMIN_QQBOT_SUPERUSERS:-[]}"
      MC_ADMIN_QQBOT_EXCLUDED_SERVERS: "${MC_ADMIN_QQBOT_EXCLUDED_SERVERS:-[]}"
      MC_ADMIN_QQBOT_DEFAULT_SERVER:
      MC_ADMIN_QQBOT_DATABASE_URL: "${MC_ADMIN_QQBOT_DATABASE_URL:-sqlite+aiosqlite:///./data/bot.db}"
      MC_ADMIN_QQBOT_RESTART_TIMEOUT_SECONDS: "${MC_ADMIN_QQBOT_RESTART_TIMEOUT_SECONDS:-600}"
      MC_ADMIN_QQBOT_RESTART_POLL_INTERVAL_SECONDS: "${MC_ADMIN_QQBOT_RESTART_POLL_INTERVAL_SECONDS:-5}"
      MC_ADMIN_QQBOT_HOST: "${MC_ADMIN_QQBOT_HOST:-0.0.0.0}"
      MC_ADMIN_QQBOT_PORT: "${MC_ADMIN_QQBOT_PORT:-8080}"
      MC_ADMIN_QQBOT_LOG_LEVEL: "${MC_ADMIN_QQBOT_LOG_LEVEL:-INFO}"
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
    restart: unless-stopped
    init: true
