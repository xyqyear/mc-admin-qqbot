services:
  bot:
    image: "${MC_ADMIN_QQBOT_IMAGE:-ghcr.io/xyqyear/mc-admin-qqbot:0.2.0}"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      MC_ADMIN_QQBOT_QQ_APP_ID: "${MC_ADMIN_QQBOT_QQ_APP_ID:?Set QQ_APP_ID}"
      MC_ADMIN_QQBOT_QQ_APP_SECRET: "${MC_ADMIN_QQBOT_QQ_APP_SECRET:?Set QQ_APP_SECRET}"
      MC_ADMIN_QQBOT_MC_ADMIN_BASE_URL: "${MC_ADMIN_QQBOT_MC_ADMIN_BASE_URL:?Set MC_ADMIN_BASE_URL}"
      MC_ADMIN_QQBOT_MC_ADMIN_MASTER_TOKEN: "${MC_ADMIN_QQBOT_MC_ADMIN_MASTER_TOKEN:?Set MC_ADMIN_MASTER_TOKEN}"
      MC_ADMIN_QQBOT_DEFAULT_SERVER:
      MC_ADMIN_QQBOT_DATABASE_URL: "${MC_ADMIN_QQBOT_DATABASE_URL:-sqlite+aiosqlite:///./data/official-bot.db}"
      MC_ADMIN_QQBOT_LOG_LEVEL: "${MC_ADMIN_QQBOT_LOG_LEVEL:-INFO}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
